<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物角色扮演 · 张骞出塞 · 完整版（三幕）</title>
<style>
:root{
  --bg:#fdf6e3; --card:#fff; --ink:#3d3a2e; --gold:#d4a017; --gold2:#b8860b;
  --sky:#8ecae6; --desert:#e9c46a; --green:#2a9d8f; --danger:#e07a5f; --night:#264653;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(180deg,#fdf6e3 0%,#f5e9c8 100%);
  color:var(--ink); min-height:100vh;
}
.app{max-width:720px; margin:0 auto; padding:14px;}

/* 顶栏：行囊 */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border-radius:16px; padding:10px 14px;
  border:2px solid var(--gold); margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .logo{font-size:1.5rem;}
.brand h1{font-size:1.05rem; line-height:1.2;}
.brand .sub{display:block; font-size:.68rem; color:#8a8578; font-weight:400;}
.bag-btn{
  background:#fff3d8; border:2px solid var(--gold); border-radius:999px;
  padding:6px 14px; font-size:.85rem; cursor:pointer; color:var(--gold2); font-weight:700;
}
.bag-btn:hover{background:#ffe9b8;}

/* 三状态条：使命/补给/见闻 */
.statusbar{
  display:flex; gap:8px; margin-bottom:12px; padding:10px 12px;
  background:var(--card); border-radius:16px; border:2px solid #e8dcc0;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.st-item{flex:1; text-align:center; padding:6px 4px; border-radius:12px; background:#fdf9ee;}
.st-item .st-ico{font-size:1.3rem; display:block; margin-bottom:2px;}
.st-item .st-nm{font-size:.68rem; font-weight:800; color:#5b4a2a; display:block;}
.st-item .st-bar{height:6px; background:#eee3c8; border-radius:999px; margin:5px 6px 0; overflow:hidden;}
.st-item .st-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#f0c75e,#d4a017); transition:width .4s;}
.st-item .st-val{font-size:.68rem; font-weight:800; color:var(--gold2);}
.st-item.st-low .st-fill{background:linear-gradient(90deg,#e07a5f,#c05a3f);}
.st-item.st-low .st-val{color:#c05a3f;}

/* 说书人 */
.narrator{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;}
.narrator .avatar{font-size:2.6rem; line-height:1;}
.narrator .bubble{
  flex:1; background:var(--card); border-radius:16px; padding:14px 16px;
  border:2px solid #e8dcc0; font-size:1.02rem; line-height:1.75; box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.narrator .who{display:block; font-size:.72rem; color:#a89c80; margin-bottom:4px; font-weight:700;}

/* 场景大图 */
.scene{
  background:var(--card); border-radius:16px; border:2px solid #e8dcc0;
  padding:14px; margin-bottom:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.scene .big{font-size:3.6rem; margin-bottom:6px;}
.scene .place{font-size:.8rem; color:#a89c80;}

/* 地图（路线决策用） */
.mapbox{
  background:linear-gradient(180deg,#bfe3f2 0%,#f4e3bb 70%,#e9c46a 100%);
  border-radius:14px; padding:10px; margin-top:10px; position:relative; min-height:150px;
  border:2px solid #d8cba8;
}
.mapbox .m-title{font-size:.78rem; font-weight:700; color:#5b7a8c; margin-bottom:6px; text-align:left;}
.maprow{display:flex; align-items:center; justify-content:space-between; gap:4px; flex-wrap:nowrap;}
.mstop{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:52px;}
.mstop .pin{font-size:1.6rem;}
.mstop .nm{font-size:.62rem; font-weight:700; color:#3d3a2e; background:#fff9; border-radius:999px; padding:1px 6px;}
.mstop .note{font-size:.6rem; color:#7a6f55;}
.mpath{flex:1; height:3px; background:#b8860b88; position:relative; min-width:14px;}
.mpath::after{content:"🐫"; position:absolute; top:-9px; left:40%; font-size:1rem;}
.mpath.off{background:#ccc8bb;}
/* 走廊俯视图（山/沙夹绿洲） */
.mapbox.corridor{padding:10px; background:linear-gradient(180deg,#fff8e8,#fdf3e0); border:2px solid #e8dcc0; border-radius:14px;}
.cor-zone{text-align:center; font-size:.72rem; font-weight:800; padding:6px; border-radius:8px;}
.cor-zone.sand{background:#f5e6c8; color:#a08030; border:2px dashed #d4b06a;}
.cor-zone.snow{background:#eaf4f8; color:#3a6a8a; border:2px dashed #8ab5c8; margin-top:6px;}
.cor-row{display:flex; align-items:center; justify-content:space-between; gap:4px; padding:10px 4px;}
.cor-start,.cor-end{font-size:.78rem; font-weight:800; color:#5b4a2a; background:#fff; border:2px solid #e8dcc0; border-radius:10px; padding:6px 8px; flex-shrink:0;}
.cor-oasis{flex:1; display:flex; align-items:center; justify-content:space-around; background:linear-gradient(180deg,#a8d5a2,#7cb86b); border-radius:10px; padding:8px 6px; min-height:52px;}
.oasis{display:flex; flex-direction:column; align-items:center; font-size:1.2rem; filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));}
.oasis em{font-size:.6rem; font-weight:800; color:#fff; font-style:normal; text-shadow:0 1px 2px rgba(0,0,0,.4);}
.oasis.off{opacity:.35; filter:grayscale(.8);}
.cor-tip{text-align:center; font-size:.7rem; color:#8a6d00; background:#fff8e8; border-radius:8px; padding:5px 8px; margin-top:6px;}
/* 答后揭晓动画 */
.mapbox.reveal,.illus-box.reveal{animation:revealIn .5s ease;}
.relay-box{background:linear-gradient(135deg,#fdf6e3,#f5ead0);border:2px solid var(--gold);border-radius:14px;padding:12px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.relay-title{font-size:.92rem;font-weight:800;color:#6b6350;margin-bottom:4px;}
.relay-problem{font-size:.78rem;color:#8a6d00;margin-bottom:10px;line-height:1.5;}
.relay-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.relay-node{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:12px;background:#fff;border:2px solid #e8dcc0;min-width:64px;cursor:pointer;transition:all .2s;}
.relay-node.done{border-color:#7ab86a;background:#eef7e6;}
.relay-node.cur{border-color:#b8860b;background:#fff3d8;box-shadow:0 2px 8px rgba(184,134,11,.3);}
.relay-node.locked{border-color:#d8d0c0;background:#f5f2ea;cursor:not-allowed;opacity:.7;}
.relay-node:hover:not(.locked){transform:translateY(-2px);}
.relay-ico{font-size:1.2rem;}
.relay-nm{font-size:.68rem;font-weight:700;color:#3d3a2e;margin-top:2px;}
.relay-st{font-size:.58rem;color:#a89c80;}
.relay-arrow{color:#b8860b;font-size:.9rem;}
.relay-next{margin-top:10px;text-align:center;font-size:.75rem;color:#8a6d00;background:#fff3d8;border-radius:8px;padding:5px;}
.routes-box{background:linear-gradient(135deg,#fff8e8,#fdf3e0);border:2px solid #e8dcc0;border-radius:14px;padding:14px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.routes-title{font-weight:bold;color:#6b6350;margin-bottom:10px;font-size:14px;}
.route-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;border:2px dashed transparent;transition:all .3s;}
.route-row.danger{background:#fff0f0;border-color:#e8c4c4;opacity:.85;}
.route-row.safe{background:#eef7e6;border-color:#c5d8a8;}
.route-row.chosen{border:2px solid #b8860b;background:#fdf6e3;box-shadow:0 2px 8px rgba(184,134,11,.25);}
.route-ico{font-size:22px;flex-shrink:0;}
.route-name{font-weight:bold;color:#3d3a2e;flex-shrink:0;width:88px;}
.route-tag{font-size:12px;color:#6b6350;flex:1;line-height:1.4;}
.route-verdict{font-size:12px;font-weight:bold;flex-shrink:0;padding:2px 8px;border-radius:8px;}
.route-verdict.bad{background:#f6d5d5;color:#a33;}
.route-verdict.good{background:#d8eec8;color:#3a6a2a;}
@keyframes revealIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.mstop.mount .pin{font-size:2rem;}
.mstop.mount .nm{background:#d8eef9;}
.mstop.well .pin{font-size:1.4rem;}
/* 示意图 */
.illus-box{background:#fff; border:2px solid #e8dcc0; border-radius:14px; padding:12px; margin-top:10px; box-shadow:0 2px 8px rgba(0,0,0,.05);}
.illus-title{text-align:center; font-size:.85rem; font-weight:800; color:#5b7a8c; margin-bottom:8px;}
.illus-svg svg{width:100%; height:auto; display:block;}
.illus-cap{text-align:center; font-size:.72rem; color:#a89c80; margin-top:6px;}

/* 选项 */
.choices{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.choice{
  background:var(--card); border:2.5px solid #e0d5b5; border-radius:14px;
  padding:13px 16px; font-size:.98rem; line-height:1.55; cursor:pointer; text-align:left;
  color:var(--ink); transition:all .15s; display:flex; align-items:flex-start; gap:10px;
}
.choice:hover{border-color:var(--gold); background:#fffdf5; transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.07);}
.choice .c-ico{font-size:1.5rem; flex-shrink:0;}
.choice.disabled{opacity:.5; pointer-events:none;}

/* 后果反馈 */
.feedback{
  background:#fff; border-radius:16px; border:2px solid var(--gold);
  padding:16px; margin-top:14px; font-size:1rem; line-height:1.75;
  animation:popIn .35s ease; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.feedback.knowledge{border-color:#2a9d8f; background:#f2fbf8;}
.feedback.bad{border-color:#e07a5f; background:#fdf3f0;}
.feedback h4{font-size:.85rem; margin-bottom:6px; color:#8a8578;}
.feedback .k-title{font-size:1.05rem; font-weight:800; color:var(--green); margin-bottom:4px;}

/* 继续按钮 */
.next-btn{
  margin-top:14px; width:100%; padding:14px; font-size:1.05rem; font-weight:800;
  background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#fff;
  border:none; border-radius:14px; cursor:pointer; box-shadow:0 4px 0 #8a6d12;
  transition:all .12s;
}
.next-btn:hover{filter:brightness(1.06);}
.next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a6d12;}
.next-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

/* 行囊弹窗 */
dialog{
  border:none; border-radius:18px; padding:0; max-width:520px; width:90%;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(30,40,60,.55);}
.dialog-pad{padding:20px;}
.dialog-pad h2{font-size:1.1rem; margin-bottom:12px; color:var(--gold2);}
.item-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.item{background:#fdf9ee; border:2px solid #e8dcc0; border-radius:12px; padding:10px; text-align:center;}
.item .i-ico{font-size:2rem; display:block; margin-bottom:4px;}
.item .i-nm{font-size:.78rem; font-weight:700;}
.item.locked{opacity:.35; filter:grayscale(.8);}
.item.locked .i-ico{content:"❓";}
.close-btn{width:100%; padding:12px; font-size:.95rem; font-weight:700; background:#f0ead8; border:none; border-radius:12px; cursor:pointer; color:#6b6350;}

/* 出使记录 */
.record{
  background:#fff; border-radius:18px; border:3px solid var(--gold); padding:20px; margin-top:14px;
  animation:popIn .4s ease; box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.record h3{text-align:center; font-size:1.2rem; color:var(--gold2); margin-bottom:12px;}
.record .r-row{font-size:.98rem; line-height:1.8; margin-bottom:8px;}
.record .r-row b{color:var(--ink);}
.record .seal{text-align:center; margin-top:14px; font-size:.95rem; color:#6b6350;}
.record .seal b{font-size:1.1rem; color:var(--gold2);}
.sig-input{
  width:100%; padding:12px; border:2px solid #e0d5b5; border-radius:12px; font-size:1rem;
  margin-top:8px; font-family:inherit;
}
.sig-input:focus{outline:none; border-color:var(--gold);}

/* 动画 */
@keyframes popIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

/* 进度点 */
.progress{display:flex; gap:6px; justify-content:center; margin-bottom:12px;}
.dot{width:10px; height:10px; border-radius:50%; background:#e0d5b5; transition:all .3s;}
.dot.on{background:var(--gold); transform:scale(1.2);}
.dot.done{background:#2a9d8f;}
/* ===== 反馈问卷 + 语音 + 奖励 ===== */
.sv-wrap{padding:18px; max-width:520px; max-height:84vh; overflow:auto;}
.sv-head{font-size:1.1rem; font-weight:800; color:var(--gold2); margin-bottom:4px;}
.sv-sub{font-size:.76rem; color:#a89c80; margin-bottom:14px; line-height:1.6;}
.sv-q{margin-bottom:16px;}
.sv-label{font-size:.92rem; font-weight:700; margin-bottom:8px; color:#5b4a2a;}
.sv-label .req{color:#e07a5f;}
.sv-stars{display:flex; gap:6px; font-size:1.9rem; cursor:pointer;}
.sv-stars .st{filter:grayscale(1) opacity(.35); transition:all .15s; user-select:none;}
.sv-stars .st.on{filter:none; transform:scale(1.12);}
.sv-opts{display:flex; flex-wrap:wrap; gap:8px;}
.sv-opt{padding:8px 14px; border-radius:999px; border:2px solid #e0d5b5; background:#fff; font-size:.85rem; cursor:pointer; transition:all .15s;}
.sv-opt:hover{border-color:var(--gold);}
.sv-opt.sel{background:#fff3d8; border-color:var(--gold); font-weight:700; color:var(--gold2);}
.sv-opt.multi.sel{background:#e8f8f3; border-color:#2a9d8f; color:#1c6b62;}
.sv-text{width:100%; min-height:60px; padding:10px; border:2px solid #e0d5b5; border-radius:12px; font-size:.9rem; font-family:inherit; resize:vertical;}
.sv-text:focus{outline:none; border-color:var(--gold);}
.sv-actions{display:flex; gap:10px; margin-top:6px;}
.sv-btn{flex:1; padding:12px; border:none; border-radius:12px; font-size:.95rem; font-weight:800; cursor:pointer; color:#fff;}
.sv-submit{background:linear-gradient(180deg,var(--gold),var(--gold2)); box-shadow:0 3px 0 #8a6d12;}
.sv-skip{background:#f0ead8; color:#6b6350;}
.sv-export{background:linear-gradient(180deg,#5aa9a0,#2a9d8f); box-shadow:0 3px 0 #1c6b62;}
.sv-voice{margin-top:6px; padding:12px; border:2px dashed var(--gold); border-radius:14px; background:#fffdf5;}
.sv-voice .v-status{font-size:.85rem; color:#5b4a2a; margin-bottom:8px; min-height:1.2em;}
.sv-rec{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.sv-rec-btn{padding:10px 18px; border:none; border-radius:999px; font-size:.9rem; font-weight:800; cursor:pointer; color:#fff; background:#e07a5f;}
.sv-rec-btn.recording{background:#c0392b; animation:pulse 1.2s infinite;}
.sv-transcript{margin-top:8px; font-size:.85rem; color:#1c6b62; background:#e8f8f3; border-radius:10px; padding:8px 10px; white-space:pre-wrap; display:none;}
.sv-audio{margin-top:8px; width:100%; display:none;}
.sv-privacy{font-size:.7rem; color:#a89c80; margin-top:10px; line-height:1.5;}
.sv-badge-show{margin-top:12px; text-align:center; font-size:.95rem; font-weight:800; color:var(--gold2); background:#fff3d8; border:2px solid var(--gold); border-radius:14px; padding:10px; animation:popIn .4s ease;}
.end-actions{display:flex; gap:10px; margin-top:14px;}
.end-fb-btn{flex:1; padding:13px; border:none; border-radius:14px; font-size:.95rem; font-weight:800; cursor:pointer; color:#fff; background:linear-gradient(180deg,#b8860b,#8a6d12); box-shadow:0 4px 0 #6b530f;}
.end-voice-btn{flex:1; padding:13px; border:none; border-radius:14px; font-size:.95rem; font-weight:800; cursor:pointer; color:#fff; background:linear-gradient(180deg,#5aa9a0,#2a9d8f); box-shadow:0 4px 0 #1c6b62;}
.end-export-btn{flex:1; padding:13px; border:none; border-radius:14px; font-size:.95rem; font-weight:800; cursor:pointer; color:#fff; background:linear-gradient(180deg,#6d4d96,#54357a); box-shadow:0 4px 0 #3a2560;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🐫</span>
      <h1>张骞出塞<span class="sub">历史人物角色扮演 · 完整三幕</span></h1>
    </div>
    <button class="bag-btn" id="bagBtn">🎒 行囊 <span id="bagCount">0</span>/6</button>
  </header>

  <!-- 三状态条：使命/补给/见闻 -->
  <div class="statusbar" id="statusbar">
    <div class="st-item" id="stMission">
      <span class="st-ico">🎋</span><span class="st-nm">使命</span>
      <div class="st-bar"><div class="st-fill" style="width:100%"></div></div><span class="st-val" id="stMissionV">10/10</span>
    </div>
    <div class="st-item" id="stSupply">
      <span class="st-ico">🥣</span><span class="st-nm">补给</span>
      <div class="st-bar"><div class="st-fill" style="width:100%"></div></div><span class="st-val" id="stSupplyV">10/10</span>
    </div>
    <div class="st-item" id="stGain">
      <span class="st-ico">📜</span><span class="st-nm">见闻</span>
      <div class="st-bar"><div class="st-fill" style="width:20%"></div></div><span class="st-val" id="stGainV">2/10</span>
    </div>
  </div>

  <!-- 进度点 -->
  <div class="progress" id="progress"></div>

  <!-- 主舞台 -->
  <main id="stage"></main>

  <!-- 行囊弹窗 -->
  <dialog id="bagDialog">
    <div class="dialog-pad">
      <h2>🎒 我的行囊</h2>
      <div class="item-grid" id="bagGrid"></div>
      <button class="close-btn" id="closeBag">收好行囊 👍</button>
    </div>
  </dialog>
</div>

<script>
/* ================= 音效 ================= */
const sfx = {
  audioCtx:null,
  beep(freq,dur,type,vol){
    try{
      this.audioCtx = this.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=this.audioCtx.createOscillator(), g=this.audioCtx.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.08, this.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.audioCtx.currentTime+dur);
      o.connect(g); g.connect(this.audioCtx.destination);
      o.start(); o.stop(this.audioCtx.currentTime+dur);
    }catch(e){}
  },
  move(){ this.beep(520,.08,"triangle"); },
  good(){ this.beep(660,.12,"sine"); setTimeout(()=>this.beep(880,.15,"sine"),90); },
  star(){ this.beep(1040,.1,"triangle",.1); },
  bad(){ this.beep(220,.2,"sawtooth",.06); },
  secret(){ [660,780,990,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,.14,"triangle",.09),i*110)); }
};

/* ===== [BGM] 轻量背景音乐·五声音阶（Web Audio 合成，无文件依赖） ===== */
(function(){
  try{
    var _ctx=null,_started=false,_bgmTimer=null,_muted=false;
    var _pent=[523.25,587.33,659.25,783.99,880.00,1046.50,587.33,523.25]; /* C5 D5 E5 G5 A5 C6 D5 C5 五声 */
    function _note(){
      if(!_ctx||_muted) return;
      try{
        var f=_pent[Math.floor(Math.random()*_pent.length)];
        var o=_ctx.createOscillator(),g=_ctx.createGain();
        o.type="sine"; o.frequency.value=f;
        var t=_ctx.currentTime;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.018,t+0.5);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
        o.connect(g); g.connect(_ctx.destination);
        o.start(t); o.stop(t+2.6);
      }catch(e){}
      _bgmTimer=setTimeout(_note,1500+Math.random()*2000);
    }
    function _start(){
      if(_started) return; _started=true;
      try{ _ctx=_ctx||new (window.AudioContext||window.webkitAudioContext)(); _note(); }catch(e){}
    }
    function _toggleMute(){
      _muted=!_muted;
      if(_muted){ if(_bgmTimer){clearTimeout(_bgmTimer);_bgmTimer=null;} }
      else { _start(); }
    }
    document.addEventListener("pointerdown",_start);
    document.addEventListener("keydown",_start);
    window.addEventListener("touchstart",_start,{passive:true});

/* ================= 三状态系统（使命/补给/见闻） ================= */
const STATUS_MAX = 10;
let stMission = 10, stSupply = 10, stGain = 2;
function changeStatus(delta){
  // delta: {mission?, supply?, gain?} 每项可为 -2..+2
  stMission = Math.max(0, Math.min(STATUS_MAX, stMission + (delta.mission||0)));
  stSupply  = Math.max(0, Math.min(STATUS_MAX, stSupply  + (delta.supply||0)));
  stGain    = Math.max(0, Math.min(STATUS_MAX, stGain    + (delta.gain||0)));
  updateStatus();
  // 补给耗尽 → 特殊提示
  if(stSupply <= 0){
    const fb = document.createElement("div");
    fb.className = "feedback bad";
    fb.innerHTML = "<h4>🥣 补给耗尽！</h4><div>队伍没吃的了——你不得不停下来打猎、找水，耽搁了行程。使命 +0（但人还在）。下次出发前，记得备足干粮！</div>";
    stage.appendChild(fb);
  }
}
function updateStatus(){
  const set = (idv, val, elId)=>{
    const el = document.getElementById(elId);
    el.textContent = val + "/" + STATUS_MAX;
    const item = el.closest(".st-item");
    const fill = item.querySelector(".st-fill");
    fill.style.width = (val/STATUS_MAX*100) + "%";
    item.classList.toggle("st-low", val <= 3);
  };
  set(null, stMission, "stMissionV");
  set(null, stSupply, "stSupplyV");
  set(null, stGain, "stGainV");
}

/* ================= 引擎 ================= */
let cur = 0;           // 当前节点下标
let name = "";         // 孩子名字
let wrongPicks = 0;    // 选错次数
const picked = new Set(); // 已收集物品去重

const $ = (id)=>document.getElementById(id);
const stage = $("stage");

function renderNode(i){
  cur = i;
  const n = STORY[i];
  // 进度点
  const prog = $("progress");
  prog.innerHTML = STORY.map((_,idx)=>`<span class="dot ${idx<i?"done":idx===i?"on":""}"></span>`).join("");
  // 舞台
  let html = "";
  html += `<div class="narrator"><div class="avatar">${n.scene||"📜"}</div><div class="bubble"><span class="who">${n.who||"📜 说书人"}</span>${n.narrator}</div></div>`;
  if(n.map && !n.afterMap){
    if(n.map.type === "routes"){
      html += `<div class="routes-box"><div class="routes-title">${n.map.title}</div>`;
      n.map.routes.forEach((r,idx)=>{
        const chosen = n.map.chosen===idx;
        html += `<div class="route-row ${r.verdict==="good"?"safe":"danger"} ${chosen?"chosen":""}">
          <span class="route-ico">${r.ico}</span><span class="route-name">${r.nm}</span>
          <span class="route-tag">${r.tag}</span>
          <span class="route-verdict">${n.map.chosen<0?"❓":(chosen?"✅ 你选了这条":(r.verdict==="good"?"👍 你走对了！":"💔 这条路走不通"))}</span></div>`;
      });
      html += `<div class="cor-tip">${n.map.tip||""}</div></div>`;
    } else if(n.map.type === "corridor"){
      // 走廊俯视图：沙漠(上墙) + 绿洲串(中路) + 雪山(下墙)
      html += `<div class="mapbox corridor"><div class="m-title">${n.map.title}</div>
        <div class="cor-zone sand">🏜️ 大沙漠 · 没有水</div>
        <div class="cor-row">
          <div class="cor-start">${n.map.start||"🏯 长安"}</div>
          <div class="cor-oasis">${(n.map.oases||[]).map((o,i)=>`<span class="oasis ${i>=n.map.highlight?"off":""}" title="${o.note||""}">${o.ico}<em>${o.nm}</em></span>`).join("")}</div>
          <div class="cor-end">${n.map.end||"🌍 西域"}</div>
        </div>
        <div class="cor-zone snow">🏔️ 祁连山 · 雪水浇出绿洲</div>
        <div class="cor-tip">两条“墙”中间的路，叫 走·廊 —— 有水才有城，所以只能贴着雪山走</div>
      </div>`;
    } else {
      html += `<div class="mapbox"><div class="m-title">${n.map.title}</div><div class="maprow">`;
      n.map.stops.forEach((s,idx)=>{
        html += `<div class="mstop ${s.cls||""}"><span class="pin">${s.ico}</span><span class="nm">${s.nm}</span><span class="note">${s.note||""}</span></div>`;
        if(idx < n.map.stops.length-1) html += `<div class="mpath ${idx>=n.map.highlight?"off":""}"></div>`;
      });
      html += `</div></div>`;
    }
  }
  if(n.illus && !n.afterIllus){
    html += `<div class="illus-box"><div class="illus-title">${n.illus.title||"示意图"}</div><div class="illus-svg">${n.illus.svg}</div>${n.illus.caption?`<div class="illus-cap">${n.illus.caption}</div>`:""}</div>`;
  }
  html += `<div class="choices" id="choices"></div>`;
  stage.innerHTML = html;

  const cbox = $("choices");
  n.choices.forEach((c,idx)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="c-ico">${c.ico}</span><span>${c.text}</span>`;
    btn.addEventListener("click", ()=>choose(n, c, btn));
    cbox.appendChild(btn);
  });
}

function choose(n, c, btn){
  sfx.move();
  // 路线图：记录选择，选择后揭示对错
  if(n.map && n.map.type==="routes" && n.map.chosen<0){
    const idx = n.choices.indexOf(c);
    n.map.chosen = idx;
  }
  // 禁用所有选项
  document.querySelectorAll(".choice").forEach(b=>b.classList.add("disabled"));
  // 状态变化（使命/补给/见闻）
  if(c.st){ changeStatus(c.st); }
  // 路线图：选择后立即揭示对错
  if(n.map && n.map.type==="routes"){
    const rows = document.querySelectorAll(".route-row");
    rows.forEach((row,idx)=>{
      const r = n.map.routes[idx];
      const v = row.querySelector(".route-verdict");
      if(v) v.textContent = idx===n.map.chosen ? "✅ 你选了这条" : (r.verdict==="good" ? "👍 你走对了！" : "💔 这条路走不通");
    });
  }
  // 物品
  if(c.item && !owned.has(c.item)){
    owned.add(c.item);
    updateBag();
    sfx.star();
  }
  // 知识卡/后果
  if(c.kTitle){
    const fb = document.createElement("div");
    fb.className = "feedback knowledge" + (c.good===false?" bad":"");
    fb.innerHTML = `<h4>${c.good===false?"🧠 线索":"✨ 你获得了知识"}</h4><div class="k-title">${c.kTitle}</div><div>${c.kBody}</div>`;
    stage.appendChild(fb);
  }
  // 答后揭晓：选择后再显示地图/示意图（惊喜感）
  if(n.afterMap && n.map){
    const mb = document.createElement("div");
    mb.className = "mapbox reveal";
    if(n.map.type === "corridor"){
      mb.innerHTML = `<div class="m-title">${n.map.title}</div>
        <div class="cor-zone sand">🏜️ 大沙漠 · 没有水</div>
        <div class="cor-row">
          <div class="cor-start">${n.map.start||"🏯 长安"}</div>
          <div class="cor-oasis">${(n.map.oases||[]).map((o,i)=>`<span class="oasis">${o.ico}<em>${o.nm}</em></span>`).join("")}</div>
          <div class="cor-end">${n.map.end||"🌍 西域"}</div>
        </div>
        <div class="cor-zone snow">🏔️ 祁连山 · 雪水浇出绿洲</div>
        <div class="cor-tip">两条“墙”中间的路，叫 走·廊 —— 有水才有城，所以只能贴着雪山走</div>`;
    } else if(n.map.type === "routes" && c.idx!==undefined){
      // 高亮你选的路
      const rows = document.querySelectorAll(".route-row");
      rows.forEach(r=>r.classList.remove("chosen"));
      if(rows[c.idx]) rows[c.idx].classList.add("chosen");
      mb.innerHTML = "";
      const rtag = document.createElement("div");
      rtag.className = "cor-tip";
      rtag.textContent = c.good ? "🎉 你选了这条路——它真的能带你活着走到西域！" : "🧠 你选了这条路——再想想，它真的走得通吗？";
      mb.appendChild(rtag);
    } else {
      mb.innerHTML = `<div class="m-title">${n.map.title}</div><div class="maprow">`;
      n.map.stops.forEach((s,idx)=>{
        mb.innerHTML += `<div class="mstop ${s.cls||""}"><span class="pin">${s.ico}</span><span class="nm">${s.nm}</span><span class="note">${s.note||""}</span></div>`;
        if(idx < n.map.stops.length-1) mb.innerHTML += `<div class="mpath"></div>`;
      });
      mb.innerHTML += `</div>`;
    }
    stage.appendChild(mb);
  }
  if(n.afterIllus && n.illus && c.good !== false){
    const ib = document.createElement("div");
    ib.className = "illus-box reveal";
    ib.innerHTML = `<div class="illus-title">${n.illus.title||"示意图"}</div><div class="illus-svg">${n.illus.svg}</div>${n.illus.caption?`<div class="illus-cap">${n.illus.caption}</div>`:""}`;
    stage.appendChild(ib);
  }
  if(c.good===false) wrongPicks++;
  // 下一个
  const nb = document.createElement("button");
  nb.className = "next-btn";
  nb.textContent = (c.next==="end") ? "查看我的出使记录 📜" : "继续 ▶";
  nb.addEventListener("click", ()=>{
    sfx.move();
    if(c.next==="end"){ renderEnd(); }
    else { renderNode(STORY.findIndex(x=>x.id===c.next)); }
  });
  stage.appendChild(nb);
}

  d.innerHTML = `<div class="sv-wrap">

    <div class="sv-sub">你是刚刚穿越回去、当了一回主人公的人～下面随便聊聊，答案只存在你自己的电脑/手机里。</div>
    <div class="sv-q"><div class="sv-label">⭐ 这趟穿越冒险，你打几颗星？</div><div class="sv-stars" id="svStars">${surveyStarsHtml()}</div></div>
    <div class="sv-q"><div class="sv-label">🎭 如果让你再穿越回去一次，你想改变故事里的哪一段？</div><textarea class="sv-text" id="svChange" placeholder="选填，比如：我想早点提醒 TA 别上当…">${SV.changeWish}</textarea></div>
    <div class="sv-q"><div class="sv-label">🎭 作为故事里的主人公，你最想对 TA 说的一句话是什么？</div><textarea class="sv-text" id="svSay" placeholder="选填，比如：你其实已经很厉害了！">${SV.sayTo}</textarea></div>
    <div class="sv-q"><div class="sv-label">🎭 你最喜欢自己当主人公时做的哪个选择？</div><textarea class="sv-text" id="svFavChoice" placeholder="选填，比如：我选了先去帮忙修水渠">${SV.favChoice}</textarea></div>
    <div class="sv-q"><div class="sv-label">🤔 这段冒险对你难不难？</div><div class="sv-opts" id="svDiff">${surveyOptsHtml(DIFF_OPTS)}</div></div>
    <div class="sv-q"><div class="sv-label">💬 还想对我们（做故事的人）说点什么？随便写～</div><textarea class="sv-text" id="svFree" placeholder="选填，你的话会让故事更好玩">${SV.freeText}</textarea></div>
    <div class="sv-q"><div class="sv-label">🎤 讲给爸爸妈妈听（选做）</div>
      <div class="sv-voice">
        <div class="v-status" id="vStatus">点下面按钮，把故事讲给爸妈听～</div>
        <div class="sv-rec"><button class="sv-rec-btn" id="vRec">🎤 开始讲</button></div>
        <div class="sv-transcript" id="vTranscript"></div>
        <audio class="sv-audio" id="vAudio" controls></audio>
      </div>
    </div>
    <div class="sv-privacy">🔒 你的录音不会被我们保存或上传。语音识别使用你浏览器自带的引擎（部分浏览器会把声音发给厂商做识别）。</div>
    <div class="sv-actions">
      <button class="sv-btn sv-skip" id="svSkip">下次再说</button>
      <button class="sv-btn sv-submit" id="svSubmit">提交建议 🎁</button>
    </div>
  </div>`;
  const svStarsEl = d.querySelector("#svStars");
  if(svStarsEl) svStarsEl.addEventListener("click",(ev)=>{
    const st = ev.target.closest(".st"); if(!st) return;
    SV.stars = Number(st.dataset.v);
    svStarsEl.innerHTML = surveyStarsHtml();
    saveFeedback();
  });
  ["#svDiff"].forEach(sel=>{
    d.querySelectorAll(sel+" .sv-opt").forEach(el=>{
      el.addEventListener("click",()=>{ d.querySelectorAll(sel+" .sv-opt").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); SV.diff=el.dataset.val; });
    });
  });
  d.querySelector("#svChange").addEventListener("input",e=>{SV.changeWish=e.target.value;saveFeedback();});
  d.querySelector("#svSay").addEventListener("input",e=>{SV.sayTo=e.target.value;saveFeedback();});
  d.querySelector("#svFavChoice").addEventListener("input",e=>{SV.favChoice=e.target.value;saveFeedback();});
  d.querySelector("#svFree").addEventListener("input",e=>{SV.freeText=e.target.value;saveFeedback();});
  d.querySelector("#vRec").addEventListener("click",toggleVoice);
  d.querySelector("#svSkip").addEventListener("click",()=>d.close());
  d.querySelector("#svSubmit").addEventListener("click",()=>{
    saveFeedback(); grantReward("survey"); d.close();
    alert("🎁 谢谢你的建议！你获得了「分享小达人」徽章～");
  });
  d.showModal();
}
function toggleVoice(){
  const statusEl = document.getElementById("vStatus");
  const transEl = document.getElementById("vTranscript");
  const audioEl = document.getElementById("vAudio");
  const btn = document.getElementById("vRec");
  if(_sr && _sr.state !== "inactive"){ try{_sr.stop();}catch(e){} return; }
  if(_mediaRec && _mediaRec.state === "recording"){ try{_mediaRec.stop();}catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR && navigator.onLine){
    try{
      const rec = new SR(); rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false;
      rec.onresult = (e)=>{ let t=""; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; SV.voiceText=t; transEl.style.display="block"; transEl.textContent="你说："+t; };
      rec.onerror = ()=>{ startFallbackRecord(statusEl,transEl,audioEl,btn); };
      rec.onend = ()=>{ _sr=null; btn.textContent="🎤 开始讲"; if(SV.voiceRecorded||SV.voiceText){ finishVoice(statusEl,transEl); } };
      _sr = rec; rec.start(); btn.textContent="⏹ 停止"; statusEl.textContent="🎤 正在聆听，讲完点停止…";
      return;
    }catch(e){ startFallbackRecord(statusEl,transEl,audioEl,btn); return; }
  }
  startFallbackRecord(statusEl,transEl,audioEl,btn);
}
function startFallbackRecord(statusEl,transEl,audioEl,btn){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ statusEl.textContent="⚠️ 这个浏览器不支持录音，你可以直接讲给爸妈听～"; return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _mediaRec = new MediaRecorder(stream); _recChunks=[];
    _mediaRec.ondataavailable = e=>_recChunks.push(e.data);
    _mediaRec.onstop = ()=>{ const blob=new Blob(_recChunks); audioEl.src=URL.createObjectURL(blob); audioEl.style.display="block"; SV.voiceRecorded=true; btn.textContent="🎤 开始讲"; finishVoice(statusEl,transEl); stream.getTracks().forEach(t=>t.stop()); };
    _mediaRec.start(); btn.textContent="⏹ 停止"; statusEl.textContent="🔴 录音中…讲完点停止";
  }).catch(()=>{ statusEl.textContent="⚠️ 没拿到麦克风权限，你可以直接讲给爸妈听～"; });
}
function finishVoice(statusEl,transEl){
  SV.voiceRecorded = SV.voiceRecorded || !!SV.voiceText;
  saveFeedback(); grantReward("voice");
  statusEl.textContent = SV.voiceText ? "✅ 讲得真好！已记录你的话～" : "✅ 录好啦！可以回放给爸妈听～";
  const eb = document.getElementById("fbBadge");
  if(eb && !eb.innerHTML) eb.innerHTML = '<div class="sv-badge-show">🏅 你获得了「分享小达人」徽章！</div>';
}
function initFeedbackBtns(){
  const sb = document.getElementById("surveyBtn");
  const vb = document.getElementById("voiceBtn");
  if(sb) sb.addEventListener("click",()=>{ sfx.move(); openSurvey(); });
  if(vb) vb.addEventListener("click",()=>{ sfx.move(); openSurvey(); });
  const eb2 = document.getElementById("exportBtn");
  if(eb2) eb2.addEventListener("click",()=>{
    try{
      const fb = JSON.parse(localStorage.getItem("shiguang_feedback")||"{}");
      const prog = JSON.parse(localStorage.getItem("shiguang_story_progress")||"{}");
      const data = {app:"shiguang", exported_at:new Date().toISOString(), feedback:fb, progress:prog};
      const txt = JSON.stringify(data,null,2);
      /* 通道1：复制文本（手机最可靠） */
      let copied = false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(()=>{copied=true;}).catch(()=>{});
          copied = true;
        } else if(document.execCommand){
          const ta = document.createElement("textarea");
          ta.value = txt; ta.style.position="fixed"; ta.style.left="-9999px";
          document.body.appendChild(ta); ta.focus(); ta.select();
          copied = document.execCommand("copy"); ta.remove();
        }
      }catch(e){}
      /* 通道2：下载文件（桌面最可靠） */
      try{
        const blob = new Blob([txt],{type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "shiguang_feedback_" + new Date().toISOString().slice(0,10) + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      }catch(e){}
      alert(copied ? "📤 反馈已导出并复制！去微信粘贴发给老师/家长就行～" : "📤 反馈已导出！文件已开始下载，发给老师/家长就行～");
    }catch(e){ alert("😅 导出失败："+e.message); }
  });
  try{
    const b = JSON.parse(localStorage.getItem("shiguang_badges")||"{}");
    if(b.share_master){ const eb=document.getElementById("fbBadge"); if(eb) eb.innerHTML='<div class="sv-badge-show">🏅 你已是「分享小达人」</div>'; }
  }catch(e){}
}

/* ===== [注入] 反馈系统接入手写版 ===== */
(function(){
  function ensureFbButtons(){
    var stage = document.getElementById("stage");
    if(!stage) return;
    if(stage.querySelector(".end-fb-btn")) return; // 已注入
    var actions = document.createElement("div");
    actions.className = "end-actions";
    actions.style.marginTop = "14px";
    actions.innerHTML =
      '<button class="end-fb-btn" id="surveyBtn">📝 提个小建议</button>' +
      '<button class="end-voice-btn" id="voiceBtn">🎤 讲给爸妈听</button>' +
      '<button class="end-export-btn" id="exportBtn" title="把玩过的故事反馈下载下来，交给老师/家长">📤 导出反馈</button>';
    var badge = document.createElement("div");
    badge.id = "fbBadge";
    stage.appendChild(actions);
    stage.appendChild(badge);
    initFeedbackBtns();
  }
  // hook renderEnd：结局渲染后追加反馈按钮
  if(typeof renderEnd === "function"){
    var _orig = renderEnd;
    renderEnd = function(){
      var r = _orig.apply(this, arguments);
      setTimeout(ensureFbButtons, 60);
      return r;
    };
  }
  // 兜底：DOMContentLoaded 后也检查一次（结局可能非 renderEnd 触发）
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(ensureFbButtons, 300); });
  } else {
    setTimeout(ensureFbButtons, 300);
  }
})();

</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("../sw.js").catch(()=>{}); });
}
(function(){
  if((typeof window.matchMedia==="function" && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true) return;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var fab = document.createElement("button");
  fab.id = "installFab";
  fab.textContent = isIOS ? "📲 添加到主屏幕" : "📲 安装App";
  fab.style.cssText = "position:fixed;right:14px;bottom:18px;z-index:999;background:linear-gradient(180deg,#2a9d8f,#1c6b62);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:.95rem;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;";
  document.body.appendChild(fab);
  var dPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); dPrompt = e; });
  fab.addEventListener("click", function(){
    if(dPrompt){ dPrompt.prompt(); dPrompt.userChoice.then(function(r){ if(r.outcome==="accepted") fab.remove(); }); }
    else if(isIOS){ alert("iPhone/iPad：点浏览器底部的「分享」按钮（方框+箭头），再选「添加到主屏幕」即可。"); }
    else { alert("在手机浏览器打开此页面，点「安装App」就能装到桌面。电脑上请用手机访问。"); }
  });
})();
</script>
