<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物角色扮演 · 李白写诗 · v4.1 完整五幕「人生如诗」</title>
<style>
:root{
  --bg:#f7f0e6; --card:#fff; --ink:#3d2e1e; --gold:#c9973a; --gold2:#a67c2a;
  --ink2:#6b5a44; --jade:#2a9d8f; --red:#b23a2e; --night:#2b2b3a;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"KaiTi","STKaiti","Microsoft YaHei","PingFang SC",serif;
  background:linear-gradient(180deg,#f7f0e6 0%,#efe2cd 100%);
  color:var(--ink); min-height:100vh;
}
.app{max-width:720px; margin:0 auto; padding:14px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border-radius:16px; padding:10px 14px;

  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .logo{font-size:1.5rem;}
.brand h1{font-size:1.05rem; line-height:1.2; color:var(--gold2);}
.brand .sub{display:block; font-size:.68rem; color:#a08a68; font-weight:400;}
.bag-btn{
  background:#fdf3dd; border:2px solid var(--gold); border-radius:999px;
  padding:6px 14px; font-size:.85rem; cursor:pointer; color:var(--gold2); font-weight:700;
}
.bag-btn:hover{background:#fbe8c4;}

.narrator{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;}
.narrator .avatar{font-size:2.6rem; line-height:1;}
.narrator .bubble{

}
.narrator .who{display:block; font-size:.72rem; color:#a08a68; margin-bottom:4px; font-weight:700;}

.scene{

}

.poem-card .p-title{font-size:1.15rem; font-weight:800; color:var(--gold2); margin-bottom:10px; letter-spacing:2px;}

.poem-card .p-desc{margin-top:10px; font-size:.8rem; color:#a08a68;}

.choices{display:flex; flex-direction:column; gap:10px; margin-top:4px;}

  background:var(--card); border:2.5px solid #e6d5b5; border-radius:14px;

.choice:hover{border-color:var(--gold); background:#fffdf5; transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.07);}

.choice.disabled{opacity:.5; pointer-events:none;}

  padding:16px; margin-top:14px; font-size:1rem; line-height:1.75;
  animation:popIn .35s ease; box-shadow:0 4px 14px rgba(0,0,0,.08);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}
.feedback.knowledge{border-color:var(--jade); background:#f0fbf8;}
.feedback.bad{border-color:var(--red); background:#fdf3f0;}
.feedback h4{font-size:.85rem; margin-bottom:6px; color:#a08a68;}
.feedback .k-title{font-size:1.05rem; font-weight:800; color:var(--jade); margin-bottom:4px;}
.feedback .k-title.badk{color:var(--red);}

.next-btn{

  background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#fff;

.next-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

dialog{

dialog::backdrop{background:rgba(30,40,60,.55);}
.dialog-pad{padding:20px;}
.dialog-pad h2{font-size:1.1rem; margin-bottom:12px; color:var(--gold2);}

.item{background:#fdf9ee; border:2px solid #e6d5b5; border-radius:12px; padding:10px; text-align:center;}
.item .i-ico{font-size:2rem; display:block; margin-bottom:4px;}

.close-btn{width:100%; padding:12px; font-size:.95rem; font-weight:700; background:#f0ead8; border:none; border-radius:12px; cursor:pointer; color:#6b6350;}

.record{
  background:#fff; border-radius:18px; border:3px solid var(--gold); padding:20px; margin-top:14px;
  animation:popIn .4s ease; box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.record h3{text-align:center; font-size:1.2rem; color:var(--gold2); margin-bottom:12px;}
.record .r-row{font-size:.98rem; line-height:1.8; margin-bottom:8px;}
.record .r-row b{color:var(--ink);}
.record .my-poem{
  background:#fdf9ee; border:2px solid var(--gold); border-radius:14px; padding:14px;
  text-align:center; font-size:1.3rem; line-height:2; font-weight:800; color:var(--ink);

.sig-input{
  width:100%; padding:12px; border:2px solid #e6d5b5; border-radius:12px; font-size:1rem;
  margin-top:8px;
}
.sig-input:focus{outline:none; border-color:var(--gold);}

.progress{display:flex; gap:6px; justify-content:center; margin-bottom:12px; flex-wrap:wrap;}
.dot{width:10px; height:10px; border-radius:50%; background:#e6d5b5; transition:all .3s;}
.dot.on{background:var(--gold); transform:scale(1.2);}
.dot.done{background:var(--jade);}

@keyframes popIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
@keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}
</style>
</head>

<script>
/* ================= 音效 ================= */
const sfx = {
  audioCtx:null,
  beep(freq,dur,type,vol){
    try{
      this.audioCtx = this.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=this.audioCtx.createOscillator(), g=this.audioCtx.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.08, this.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.audioCtx.currentTime+dur);
      o.connect(g); g.connect(this.audioCtx.destination);
      o.start(); o.stop(this.audioCtx.currentTime+dur);
    }catch(e){}
  },
  move(){ this.beep(520,.08,"triangle"); },
  good(){ this.beep(660,.12,"sine"); setTimeout(()=>this.beep(880,.15,"sine"),90); },
  star(){ this.beep(1040,.1,"triangle",.1); },
  bad(){ this.beep(220,.2,"sawtooth",.06); },
  secret(){ [660,780,990,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,.14,"triangle",.09),i*110)); }
};

   第四幕 放还漫游：进阶③夸张想象（把世界放大）

/* ================= 引擎 ================= */
let cur = 0;
let name = "";
let wrongPicks = 0;
const $ = (id)=>document.getElementById(id);
const stage = $("stage");
let wsState = {};
let myPoem = {};   // 记录孩子自己选出的诗（作品感）

function renderNode(i){
  cur = i;
  const n = STORY[i];
  const prog = $("progress");
  prog.innerHTML = STORY.map((_,idx)=>`<span class="dot ${idx<i?"done":idx===i?"on":""}"></span>`).join("");

  let html = "";
  html += `<div class="narrator"><div class="avatar">${n.scene||"📜"}</div><div class="bubble"><span class="who">${n.who||"📜 说书人"}</span>${n.narrator}</div></div>`;
  if(n.poem){
    html += `<div class="poem-card"><div class="p-title">${n.poem.title}</div><div class="p-lines">${n.poem.lines.join("<br>")}</div><div class="p-desc">${n.poem.desc}</div></div>`;
  }
  if(n.workshop){
    html += `<div class="workshop" id="workshop"><div class="w-title">${n.workshop.prompt}</div>`;
    n.workshop.slots.forEach((s,si)=>{
      html += `<div class="w-line">${s.label}：<span class="w-slot" id="wslot-${si}">____</span></div>`;
      html += `<div class="w-options">${s.options.map((o,oi)=>`<button class="w-opt" data-si="${si}" data-oi="${oi}">${o}</button>`).join("")}</div>`;
    });
    html += `</div>`;
  }
  html += `<div class="choices" id="choices"></div>`;
  stage.innerHTML = html;

  // 工坊选项绑定
  if(n.workshop){
    wsState = {};
    document.querySelectorAll(".w-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const si = Number(btn.dataset.si), oi = Number(btn.dataset.oi);
        const slot = n.workshop.slots[si];
        if(slot.accept.includes(oi)){
          // 清除同槽位的其他已选
          document.querySelectorAll(`.w-opt[data-si="${si}"]`).forEach(b=>b.classList.remove("picked"));
          btn.classList.add("picked");
          const slotEl = $("wslot-"+si);
          slotEl.textContent = slot.options[oi];
          slotEl.classList.add("filled");
          wsState["s"+si] = true;
          myPoem[slot.poemKey || si] = slot.options[oi];  // 记录孩子选的
          sfx.good();
        } else {
          btn.classList.add("wrong");
          sfx.bad();
          setTimeout(()=>btn.classList.remove("wrong"), 500);
        }
      });
    });
  }

  const cbox = $("choices");
  n.choices.forEach((c)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="c-ico">${c.ico}</span><span>${c.text}</span>`;
    btn.addEventListener("click", ()=>choose(n, c));
    cbox.appendChild(btn);
  });
}

function choose(n, c){
  sfx.move();
  if(n.workshop){
    const done = n.workshop.slots.every((_,si)=>wsState["s"+si]);
    if(!done){
      sfx.bad();
      const w = $("workshop");
      w.style.borderColor = "var(--red)";
      setTimeout(()=>w.style.borderColor = "", 600);
      return;
    }
  }
  document.querySelectorAll(".choice").forEach(b=>b.classList.add("disabled"));

  if(c.item && !owned.has(c.item)){
    owned.add(c.item);
    updateBag();
    sfx.star();
  }
  if(c.kTitle){
    const fb = document.createElement("div");
    fb.className = "feedback knowledge" + (c.good===false?" bad":"");
    fb.innerHTML = `<h4>${c.good===false?"🧠 线索":"✨ 你获得了知识"}</h4><div class="k-title ${c.good===false?"badk":""}">${c.kTitle}</div><div>${c.kBody}</div>`;
    stage.appendChild(fb);
  }
  if(c.good===false) wrongPicks++;

  const nb = document.createElement("button");
  nb.className = "next-btn";
  nb.textContent = (c.next==="end") ? "查看我的诗集 📜" : "继续 ▶";
  nb.addEventListener("click", ()=>{
    sfx.move();
    if(c.next==="end"){ renderEnd(); }
    else { renderNode(STORY.findIndex(x=>x.id===c.next)); }
  });
  stage.appendChild(nb);
}

/* ================= 诗囊 ================= */
function updateBag(){
  $("bagCount").textContent = owned.size;
}
function renderBag(){
  const grid = $("bagGrid");
  grid.innerHTML = Object.entries(ITEMS).map(([k,v])=>{
    const got = owned.has(k);
    return `<div class="item ${got?"":"locked"}"><span class="i-ico">${got?v.ico:"❓"}</span><span class="i-nm">${got?v.nm:"???"}</span><span style="font-size:.62rem;color:#a08a68;display:block;">${got?"已收入诗囊":"还没得到"}</span></div>`;
  }).join("");
  $("bagDialog").showModal();
}
$("bagBtn").addEventListener("click",()=>{ sfx.move(); renderBag(); });
$("closeBag").addEventListener("click",()=>$("bagDialog").close());

  const l1 = "少年出乡关";
  const l2 = myPoem["poem2"] || myPoem[0] || "____";

  stage.innerHTML = `
    <div class="record">
      <h3>📜 我的诗集 · 《我的远行》</h3>
      <div class="r-row">🧑‍🎨 <b>我扮演的角色：</b>李白，诗仙（五幕走完他的一生）</div>

      <div class="r-row">🎯 <b>我学会的三样基础：</b>①押韵（句尾声音相近→顺口好记）②意象（月亮=想家、柳=送别、酒=壮行）③对仗（上下句像照镜子）</div>
      <div class="r-row">🚀 <b>我学会的三招进阶：</b>①借景抒情（把心情藏进景色）②比喻联想（把东西想成别的）③夸张想象（把世界放大）</div>
      <div class="r-row">🗺️ <b>我走过的五幕：</b>蜀中启蒙→仗剑出蜀→长安翰林→放还漫游→乱世遇赦</div>
      <div class="r-row">🖌️ <b>我的诗囊（${owned.size}/8）：</b>${got.map(v=>v.ico+v.nm).join("、")||"还空着"}</div>
      <div class="r-row">🗣️ <b>说给爸妈听：</b>我跟着李白走完了他的一生！第一幕就学会了写诗的三样基础：押韵、意象、对仗。后来李白带我看世界：出蜀时学借景抒情（想家藏进月亮江水），长安学比喻联想（云想衣裳花想容），黄河边学夸张想象（把世界放大）。李白被皇帝赶出长安却说"天生我材必有用"；被判流放，遇赦后高兴得写下"千里江陵一日还"。我写出了自己的诗——《我的远行》！</div>
      <div style="margin-top:12px; padding:12px; border-radius:14px; background:#fdf3dd; border:2px solid var(--gold);"><b>${rank}</b><br>${rankLine}</div>
      <div class="seal">—— 小诗人 ${nameHtml} 的诗集 ✍️</div>
      <button class="next-btn" id="restartBtn" style="margin-top:16px; background:linear-gradient(180deg,#2a9d8f,#1c6b62); box-shadow:0 4px 0 #12443d;">🔄 再写一首（再玩一次）</button>
      <button class="next-btn" id="teaseBtn" style="margin-top:10px; background:linear-gradient(180deg,#8e6bb8,#6d4d96); box-shadow:0 4px 0 #4a3568;">🔜 下一位：王羲之写字 🖋️（制作中）</button>
    </div>`;
  sfx.good();

  $("nameBtn")?.addEventListener("click",()=>{
    name = $("nameInput").value.trim() || "小诗人";
    renderEnd();
  });
  $("restartBtn").addEventListener("click",()=>{ location.reload(); });
  $("teaseBtn").addEventListener("click",()=>{ sfx.secret(); alert("下一位技能大师：王羲之！跟着书圣学写字——笔顺、结构、力度，正在制作中！"); });

  /* ===== 通关记录（localStorage）===== */
  try{
    const KEY = "libai";
    const done = JSON.parse(localStorage.getItem("shiguang_story_progress") || "{}");
    done[KEY] = { done:true, at:Date.now(), rank:rank };
    localStorage.setItem("shiguang_story_progress", JSON.stringify(done));
    /* ===== 全局物品收集（图鉴）===== */
    const all = JSON.parse(localStorage.getItem("shiguang_items") || "{}");
    [...owned].forEach(k=>{ all["libai_"+k] = ITEMS[k].nm; });
    localStorage.setItem("shiguang_items", JSON.stringify(all));
  }catch(e){}
}

/* ================= 启动 ================= */
(function(){
  var cover = document.createElement("div");
  cover.id = "coverScreen";
  cover.style.cssText = "position:fixed;inset:0;z-index:999;background:#1a1a2e;display:flex;align-items:center;justify-content:center;";
  cover.innerHTML = '<div style="position:relative;width:100%;height:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;">'
    + '<img src="../img/libai.png" alt="封面" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'">'
    + '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);"></div>'
    + '<button id="coverBtn" style="position:absolute;bottom:9%;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2a9d8f,#1c6b62);color:#fff;border:none;border-radius:999px;padding:16px 44px;font-size:1.2rem;font-weight:800;box-shadow:0 5px 0 #12443d;cursor:pointer;letter-spacing:2px;">🌿 开始冒险</button>'
    + '</div>';
  document.body.appendChild(cover);
  document.getElementById("coverBtn").addEventListener("click", function(){
    cover.style.transition = "opacity .5s";
    cover.style.opacity = "0";
    setTimeout(function(){ cover.remove(); }, 500);
  });
  setTimeout(function(){ renderNode(0); updateBag(); }, 600);
})();
</script>
