<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物角色扮演 · 关汉卿 · 完整三幕「从杂剧到窦娥冤」</title>
<style>
:root{
  --bg:#f7f1e3; --card:#fff; --ink:#4a3f2a; --gold:#b8860b; --gold2:#8a6d12; --green:#2a9d8f; --green2:#1c6b62; --danger:#c0392b; --night:#2a2540; --line:#e8dcc0; --cream:#fdf6e3;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(180deg,#f7f1e3 0%,#eadfc6 100%);
  background-image:radial-gradient(rgba(184,134,11,.05) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.app{max-width:720px; margin:0 auto; padding:14px; animation:appIn .4s ease;}
@keyframes appIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg,#fffdf7,#fbf0d6); border-radius:18px; padding:12px 16px;
  border:2px solid var(--gold); margin-bottom:14px; box-shadow:0 4px 14px rgba(184,134,11,.16);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .logo{font-size:1.5rem;}
.brand h1{font-size:1.05rem; line-height:1.2; color:var(--gold2);}
.brand .sub{display:block; font-size:.68rem; color:#a89c80; font-weight:400;}
.bag-btn{
  background:#fff3d8; border:2px solid var(--gold); border-radius:999px;
  padding:6px 14px; font-size:.85rem; cursor:pointer; color:var(--gold2); font-weight:700;
}
.bag-btn:hover{background:#ffe9b8;}
.narrator{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;}
.narrator .avatar{font-size:2.6rem; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.1));}
.narrator .bubble{
  position:relative; flex:1; background:linear-gradient(180deg,#ffffff,#fffdf6); border-radius:18px; padding:14px 16px;
  border:2px solid #e8dcc0; font-size:1.02rem; line-height:1.75; box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.narrator .bubble::before{content:""; position:absolute; left:-10px; top:20px; width:0; height:0; border-top:10px solid transparent; border-bottom:10px solid transparent; border-right:11px solid #e8dcc0;}
.narrator .bubble::after{content:""; position:absolute; left:-7px; top:22px; width:0; height:0; border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:9px solid #ffffff;}
.narrator .who{display:block; font-size:.72rem; color:var(--green2); margin-bottom:4px; font-weight:800; letter-spacing:.5px;}
.relay-badge{
  background:linear-gradient(90deg,#2a9d8f,#1c6b62); color:#fff; border-radius:999px;
  padding:8px 16px; font-size:.85rem; font-weight:800; margin-bottom:12px;
  box-shadow:0 3px 10px rgba(26,110,100,.3); text-align:center;
}
.choice.adv{
  border-color:#2a9d8f; background:#f0faf8;
}
.choice.adv:hover{border-color:#1c6b62; background:#e4f5f1;}
.scene{
  background:linear-gradient(180deg,#ffffff,#fffdf6); border-radius:18px; border:2px solid #e8dcc0;
  padding:16px; margin-bottom:14px; text-align:center; box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.scene .big{font-size:3.6rem; margin-bottom:6px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.08));}
.scene .place{font-size:.8rem; color:#a89c80; font-weight:700;}
.mapbox{
  background:linear-gradient(180deg,#d8e8f0 0%,#f4e3bb 70%,#e9c46a 100%);
  border-radius:14px; padding:10px; margin-top:10px; position:relative; min-height:140px;
  border:2px solid #d8cba8;
}
.mapbox .m-title{font-size:.78rem; font-weight:700; color:#5b7a8c; margin-bottom:6px; text-align:left;}
.maprow{display:flex; align-items:center; justify-content:space-between; gap:4px; flex-wrap:nowrap;}
.mstop{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:52px;}
.mstop .pin{font-size:1.6rem;}
.mstop .nm{font-size:.62rem; font-weight:700; color:#3d3a2e; background:#fff9; border-radius:999px; padding:1px 6px;}
.mstop .note{font-size:.6rem; color:#7a6f55;}
.mpath{flex:1; height:3px; background:#b8860b88; position:relative; min-width:14px;}
.mpath::after{content:"🐫"; position:absolute; top:-9px; left:40%; font-size:1rem;}
.mpath.off{background:#ccc8bb;}
.mstop.mount .pin{font-size:2rem;}
.choices{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.choice{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg,#fff,#fffdf7); border:2.5px solid #e0d5b5; border-radius:16px;
  padding:13px 16px 13px 20px; font-size:.98rem; line-height:1.55; cursor:pointer; text-align:left;
  color:var(--ink); transition:all .18s; display:flex; align-items:flex-start; gap:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.05); min-height:52px;
}
.choice::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:linear-gradient(180deg,var(--green),var(--gold)); opacity:.55; transition:opacity .18s, width .18s;}
.choice:hover{border-color:var(--gold); background:linear-gradient(180deg,#fffdf5,#fff7e6); transform:translateY(-2px); box-shadow:0 7px 16px rgba(184,134,11,.18);}
.choice:hover::before{opacity:1; width:7px;}
.choice .c-ico{font-size:1.5rem; flex-shrink:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
.choice.disabled{opacity:.5; pointer-events:none;}
.feedback{
  background:linear-gradient(180deg,#fffdf9,#fdf6e6); border-radius:18px; border:2px solid var(--gold);
  padding:16px; margin-top:14px; font-size:1rem; line-height:1.75;
  animation:popIn .35s ease; box-shadow:0 5px 18px rgba(184,134,11,.12);
}
.feedback.knowledge{border-color:var(--green); background:linear-gradient(180deg,#f3faf8,#e8f5f1);}
.feedback.bad{border-color:var(--danger); background:#fdf3f0;}
.feedback h4{font-size:.85rem; margin-bottom:6px; color:#a89c80;}
.feedback .k-title{font-size:1.05rem; font-weight:800; color:var(--gold2); margin-bottom:4px;}
.next-btn{
  margin-top:14px; width:100%; padding:15px; font-size:1.08rem; font-weight:800;
  background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#fff;
  border:none; border-radius:16px; cursor:pointer; box-shadow:0 5px 0 #8a6d12;
  transition:all .12s; letter-spacing:1px;
}
.next-btn:hover{filter:brightness(1.06);}
.next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a6d12;}
dialog{
  border:none; border-radius:18px; padding:0; max-width:520px; width:90%;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(30,40,60,.55);}
.dialog-pad{padding:20px;}
.dialog-pad h2{font-size:1.1rem; margin-bottom:12px; color:var(--gold2);}
.item-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.item{background:#fdf9ee; border:2px solid #e8dcc0; border-radius:12px; padding:10px; text-align:center;}
.item .i-ico{font-size:2rem; display:block; margin-bottom:4px;}
.item .i-nm{font-size:.78rem; font-weight:700;}
.item.locked{opacity:.35; filter:grayscale(.8);}
.close-btn{width:100%; padding:12px; font-size:.95rem; font-weight:700; background:#f0ead8; border:none; border-radius:12px; cursor:pointer; color:#6b6350;}
.record{
  background:#fff; border-radius:18px; border:3px solid var(--gold); padding:20px; margin-top:14px;
  animation:popIn .4s ease; box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.record h3{text-align:center; font-size:1.2rem; color:var(--gold2); margin-bottom:12px;}
.record .r-row{font-size:.98rem; line-height:1.8; margin-bottom:8px;}
.record .r-row b{color:var(--ink);}
.record .seal{text-align:center; margin-top:14px; font-size:.95rem; color:#6b6350;}
.record .seal b{font-size:1.1rem; color:var(--gold2);}
.sig-input{
  width:100%; padding:12px; border:2px solid #e8dcc0; border-radius:12px; font-size:1rem; margin-top:8px;
}
.sig-input:focus{outline:none; border-color:var(--gold);}
.progress{display:flex; gap:6px; justify-content:center; margin-bottom:12px;}
.dot{width:10px; height:10px; border-radius:50%; background:#e8dcc0; transition:all .3s;}
.dot.on{background:var(--gold); transform:scale(1.2);}
.dot.done{background:var(--gold2);}
/* 示意图 */
.illus-box{
  background:var(--card); border:2px solid var(--gold); border-radius:16px;
  padding:14px; margin:12px 0; box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.illus-title{text-align:center; font-size:.95rem; font-weight:800; color:var(--gold2); margin-bottom:10px;}
.illus-svg svg{width:100%; height:auto; display:block;}
.illus-cap{text-align:center; font-size:.8rem; color:#a89c80; margin-top:8px;}
/* 知识应用（实操） */
.apply-box{background:var(--card); border:3px solid var(--gold); border-radius:16px; padding:14px; margin:12px 0; box-shadow:0 3px 10px rgba(0,0,0,.08);}
.ap-title{text-align:center; font-size:1rem; font-weight:800; color:var(--gold2); margin-bottom:6px;}
.ap-ask{font-size:.9rem; color:var(--ink); margin-bottom:10px; line-height:1.6; text-align:center;}
.ap-chip{
  display:inline-block; margin:4px; padding:8px 14px; border-radius:999px;
  border:2px solid var(--gold); background:#fff8e8; color:var(--gold2);
  font-size:.85rem; font-weight:700; cursor:pointer; transition:all .2s;
}
.ap-chip:hover{background:#ffe9b8;}
.ap-chip.ap-done{background:#e8f8f3; border-color:#2a9d8f; color:#1c6b62;}
.ap-chip.ap-sel{background:#ffe9b8; border-color:#d4772a; transform:scale(1.05);}
.ap-chip:disabled{cursor:default; opacity:.8;}
.ap-sort{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin:8px 0;}
.ap-pick{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:8px 0;}
.ap-pair{display:flex; gap:24px; justify-content:center; margin:8px 0;}
.ap-left,.ap-right{display:flex; flex-direction:column; gap:8px; min-width:130px;}
.ap-L{text-align:left;}
.ap-R{text-align:right;}
.ap-feedback{margin-top:8px; text-align:center;}
.ap-good{display:inline-block; background:#e8f8f3; color:#1c6b62; border-radius:999px; padding:6px 14px; font-size:.85rem; font-weight:700;}
.ap-bad{display:inline-block; background:#fdeaea; color:#b05050; border-radius:999px; padding:6px 14px; font-size:.82rem; font-weight:700;}
.apply-box .ap-go{display:block; margin:10px auto 0;}
.ap-slider{padding:6px 8px;}
.ap-slider-labels{display:flex; justify-content:space-between; font-size:.72rem; color:#8a8577; margin-bottom:2px;}
.ap-range{width:100%; accent-color:#d4a017; height:32px;}
.ap-slider-val{text-align:center; font-size:1.1rem; font-weight:800; color:var(--gold2); margin-top:4px;}
/* 滑块结果预览（农田小剧场） */
.ap-slider-show{margin-top:10px; text-align:center;}
.ap-show-stage{font-size:2.4rem; padding:14px; border-radius:14px; border:2px solid #e8dcc0; background:#fdf9ee; min-height:64px; display:flex; align-items:center; justify-content:center; transition:background .3s;}
.ap-show-stage.flood{background:linear-gradient(180deg,#bfe3f2,#7ec8e3); border-color:#3a86a8;}
.ap-show-stage.good{background:linear-gradient(180deg,#d5f0c8,#a8d5a2); border-color:#4a7a3a;}
.ap-show-stage.dry{background:linear-gradient(180deg,#f5e6c8,#e0b36a); border-color:#c99b3f;}
.ap-show-label{margin-top:8px; font-size:.85rem; font-weight:800; color:#5b4a2a;}
/* 结局复述检验 */
.retell-box{background:#f3edf8; border:2px solid #c9b8e8; border-radius:14px; padding:12px; margin-bottom:12px;}
.retell-title{font-size:.92rem; font-weight:800; color:#6a4a9a; margin-bottom:6px;}
.illus-box.reveal{animation:revealIn .5s ease;}
@keyframes revealIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}
.retell-opts{display:flex; flex-direction:column; gap:6px;}
.rt-opt{text-align:left; padding:8px 12px; border-radius:10px; border:2px solid #e0d4f0; background:#fff; font-size:.82rem; color:#5b4a2a; cursor:pointer; line-height:1.5;}
.rt-opt:hover{border-color:#b49ae0;}
/* 知识接力进度条 */
.relay-box{background:linear-gradient(135deg,#fdf6e3,#f5ead0); border:2px solid var(--gold); border-radius:14px; padding:12px; margin-top:12px; box-shadow:0 2px 8px rgba(0,0,0,.05);}
.relay-title{font-size:.92rem; font-weight:800; color:#6b6350; margin-bottom:4px;}
/* 你的知识网 */
.net-box{background:linear-gradient(135deg,#eef6f4,#e2f0ec); border:2px solid var(--green); border-radius:16px; padding:14px; margin-top:12px; box-shadow:0 3px 12px rgba(42,157,143,.1);}
.net-title{font-size:.95rem; font-weight:800; color:var(--green2); margin-bottom:10px;}
.net-title span{font-size:.72rem; color:#8a8577; font-weight:400;}
.net-link{background:#fff; border:2px solid #e8dcc0; border-radius:14px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; box-shadow:0 1px 4px rgba(0,0,0,.03);}
.net-link.inh{border-left:6px solid var(--green);}
.net-link.same{border-left:6px solid var(--gold2);}
.net-link.relay{border-left:6px solid #5a9a9a;}
.net-link.bridge{border-left:6px solid var(--danger);}
.net-ico{font-size:1.3rem; flex-shrink:0; margin-top:2px;}
.net-nm{font-weight:800; font-size:.85rem; color:var(--night);}
.net-nm small{font-weight:400; color:#8a8577; font-size:.68rem; margin-left:4px;}
.net-why{font-size:.76rem; color:#6b6350; margin-top:3px; line-height:1.6;}
.relay-problem{font-size:.78rem; color:#8a6d00; margin-bottom:10px; line-height:1.5;}
.relay-chain{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.relay-node{display:flex; flex-direction:column; align-items:center; padding:6px 10px; border-radius:12px; background:#fff; border:2px solid #e8dcc0; min-width:64px; cursor:pointer; transition:all .2s;}
.relay-node.done{border-color:#7ab86a; background:#eef7e6;}
.relay-node.cur{border-color:#b8860b; background:#fff3d8; box-shadow:0 2px 8px rgba(184,134,11,.3);}
.relay-node.locked{border-color:#d8d0c0; background:#f5f2ea; cursor:not-allowed; opacity:.7;}
.relay-node:hover:not(.locked){transform:translateY(-2px);}
.relay-ico{font-size:1.2rem;}
.relay-nm{font-size:.68rem; font-weight:700; color:#3d3a2e; margin-top:2px;}
.relay-st{font-size:.58rem; color:#a89c80;}
.relay-arrow{color:#b8860b; font-size:.9rem;}
.relay-next{margin-top:10px; text-align:center; font-size:.75rem; color:#8a6d00; background:#fff3d8; border-radius:8px; padding:5px;}
.rt-opt.rt-right{background:#e8f8f3; border-color:#2a9d8f; color:#1c6b62; font-weight:700;}
.rt-opt.rt-wrong{background:#fdeaea; border-color:#e07a5f; color:#c05a3f;}
.rt-good{display:inline-block; background:#e8f8f3; color:#1c6b62; border-radius:999px; padding:6px 14px; font-size:.82rem; font-weight:700; margin-top:6px;}
.rt-bad{display:inline-block; background:#fdeaea; color:#b05050; border-radius:999px; padding:6px 14px; font-size:.8rem; font-weight:700; margin-top:6px;}
/* 三状态条 */
.states-bar{display:flex; gap:8px; margin-bottom:10px; padding:8px 10px; background:var(--card); border-radius:14px; border:2px solid #e8dcc0; flex-wrap:wrap;}
.st-item{flex:1; min-width:110px; display:flex; align-items:center; gap:5px;}
.st-item .st-ico{font-size:1rem;}
.st-item .st-nm{font-size:.72rem; font-weight:800; color:#5b4a2a; flex-shrink:0;}
.st-item .st-track{flex:1; height:10px; background:#f0e8d8; border-radius:999px; overflow:hidden;}
.st-item .st-fill{height:100%; background:linear-gradient(90deg,#2a9d8f,#5bbfae); border-radius:999px; transition:width .4s;}
.st-item.st-low .st-fill{background:linear-gradient(90deg,#e07a5f,#f2a68f);}
.st-item .st-val{font-size:.72rem; font-weight:800; color:#8a8577; min-width:16px; text-align:right;}
/* 时代背景幕 */
#contextScreen{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.45); backdrop-filter:blur(3px);}
#contextScreen.hide{opacity:0; transition:opacity .4s;}
.ctx-box{max-width:480px; width:100%; background:var(--card); border:3px solid #c9b8e8; border-radius:20px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
.ctx-badge{display:inline-block; background:#f3edf8; color:#6a4a9a; border-radius:999px; padding:6px 14px; font-size:.78rem; font-weight:800; margin-bottom:12px;}
.ctx-map{width:100%; border-radius:12px; border:2px solid #e0d4f0; margin-bottom:10px;}
.ctx-era{font-size:1.05rem; font-weight:800; color:#5b4a2a; margin-bottom:8px;}
.ctx-brief{font-size:.88rem; color:#6b6350; line-height:1.8; margin-bottom:10px;}
.ctx-recap{background:#e8f8f3; border-left:4px solid #2a9d8f; border-radius:8px; padding:10px 12px; font-size:.82rem; color:#1c6b62; line-height:1.7; margin-bottom:14px;}
.ctx-go{width:100%; margin-bottom:8px;}
.ctx-skip{display:block; margin:0 auto; background:none; border:none; color:#a89c80; font-size:.75rem; cursor:pointer; text-decoration:underline;}
/* 跨故事提取卡 */
.extract-card{background:linear-gradient(135deg,#fdf3e0,#fde8c8); border:2px solid #e8b84a; border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.extract-card-optional{background:linear-gradient(135deg,#f0f8f6,#e0f0ec); border:2px solid #8ab5a8; border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.extract-title{font-size:.85rem; font-weight:800; color:#8a6d00; margin-bottom:6px;}
.extract-card-optional .extract-title{color:#1c6b62;}
.extract-body{font-size:.82rem; color:#6b6350; line-height:1.7;}
.extract-hint{font-size:.75rem; color:#a08030; margin-top:6px; background:#fff8e8; border-radius:8px; padding:6px 10px;}
.extract-quiz{margin-top:10px; background:#fff; border:2px dashed #e8b84a; border-radius:10px; padding:10px;}
.quiz-ask{font-size:.8rem; font-weight:800; color:#8a6d00; margin-bottom:8px;}
.quiz-opts{display:flex; flex-direction:column; gap:6px;}
.quiz-opt{text-align:left; padding:8px 10px; border-radius:8px; border:2px solid #f0e0c0; background:#fffdf5; font-size:.78rem; color:#5b4a2a; cursor:pointer; line-height:1.5;}
.quiz-opt:hover{border-color:#e8b84a;}
.quiz-opt.quiz-right{background:#e8f8f3; border-color:#2a9d8f; color:#1c6b62; font-weight:700;}
.quiz-opt.quiz-wrong{background:#fdeaea; border-color:#e07a5f; color:#c05a3f;}
.quiz-fb{margin-top:8px; font-size:.78rem;}
.quiz-good{background:#e8f8f3; color:#1c6b62; border-radius:8px; padding:6px 10px; font-weight:700;}
.quiz-bad{background:#fdf0e8; color:#a05020; border-radius:8px; padding:6px 10px;}
/* 幕间横幅 */
.interlude-banner{background:linear-gradient(135deg,#fdf3e0,#fde8c8); border:3px solid #e8b84a; border-radius:16px; padding:12px 16px; margin:12px 0; font-size:.95rem; font-weight:800; color:#8a6d00; text-align:center; box-shadow:0 3px 10px rgba(0,0,0,.06);}
@keyframes popIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
/* 封面层 */
#coverScreen{
  position:fixed; inset:0; z-index:999; background:#1a1a2e;
  display:flex; align-items:center; justify-content:center;
}
.cover-box{
  position:relative; width:100%; height:100%; max-width:720px; margin:0 auto;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.cover-img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.cover-mask{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
}
.cover-btn{
  position:absolute; bottom:9%; left:50%; transform:translateX(-50%);
  background:linear-gradient(180deg,#2a9d8f,#1c6b62); color:#fff; border:none;
  border-radius:999px; padding:16px 44px; font-size:1.2rem; font-weight:800;
  box-shadow:0 5px 0 #12443d; cursor:pointer; letter-spacing:2px;
  animation:pulse 1.6s ease infinite;
}
.cover-btn:hover{filter:brightness(1.1);}
.cover-grade{position:absolute; left:50%; bottom:118px; transform:translateX(-50%); background:rgba(255,255,255,.92); border-radius:14px; padding:10px 14px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.15); z-index:3;}

/* ================= 音效 ================= */
const sfx = {
  audioCtx:null,
  muted: (localStorage.getItem("shiguang_muted")==="1"),
  setMuted(m){ this.muted = m; try{ localStorage.setItem("shiguang_muted", m?"1":"0"); }catch(e){} },
  beep(freq,dur,type,vol){
    if(this.muted) return;
    try{
      this.audioCtx = this.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=this.audioCtx.createOscillator(), g=this.audioCtx.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.08, this.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.audioCtx.currentTime+dur);
      o.connect(g); g.connect(this.audioCtx.destination);
      o.start(); o.stop(this.audioCtx.currentTime+dur);
    }catch(e){}
  },
  move(){ this.beep(520,.08,"triangle"); },
  good(){ this.beep(660,.12,"sine"); setTimeout(()=>this.beep(880,.15,"sine"),90); },
  star(){ this.beep(1040,.1,"triangle",.1); },
  bad(){ this.beep(220,.2,"sawtooth",.06); },
  secret(){ [660,780,990,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,.14,"triangle",.09),i*110)); }
};

/* ===== [BGM] 轻量背景音乐·五声音阶（Web Audio 合成，无文件依赖） ===== */
(function(){
  try{
    var _ctx=null,_started=false,_bgmTimer=null,_muted=false;
    var _pent=[523.25,587.33,659.25,783.99,880.00,1046.50,587.33,523.25]; /* C5 D5 E5 G5 A5 C6 D5 C5 五声 */
    function _note(){
      if(!_ctx||_muted) return;
      try{
        var f=_pent[Math.floor(Math.random()*_pent.length)];
        var o=_ctx.createOscillator(),g=_ctx.createGain();
        o.type="sine"; o.frequency.value=f;
        var t=_ctx.currentTime;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.018,t+0.5);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
        o.connect(g); g.connect(_ctx.destination);
        o.start(t); o.stop(t+2.6);
      }catch(e){}
      _bgmTimer=setTimeout(_note,1500+Math.random()*2000);
    }
    function _start(){
      if(_started) return; _started=true;
      try{ _ctx=_ctx||new (window.AudioContext||window.webkitAudioContext)(); _note(); }catch(e){}
    }
    function _toggleMute(){
      _muted=!_muted;
      if(_muted){ if(_bgmTimer){clearTimeout(_bgmTimer);_bgmTimer=null;} }
      else { _start(); }
    }
    document.addEventListener("pointerdown",_start);
    document.addEventListener("keydown",_start);
    window.addEventListener("touchstart",_start,{passive:true});
    /* 音乐开关按钮（角落小圆钮，可随时关） */
    function _addBtn(){
      if(document.getElementById("bgmFab")) return;
      var b=document.createElement("button");
      b.id="bgmFab"; b.textContent="🎵";
      b.title="背景音乐：开/关";
      b.style.cssText="position:fixed;right:58px;bottom:18px;z-index:998;width:38px;height:38px;border-radius:50%;border:2px solid rgba(42,157,143,.5);background:rgba(255,255,255,.85);color:#2a9d8f;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;";
      b.addEventListener("click",function(e){ e.stopPropagation(); _toggleMute(); b.style.opacity=_muted?0.4:1; });
      document.body.appendChild(b);
    }
    if(document.body){ _addBtn(); }
    else { document.addEventListener("DOMContentLoaded",_addBtn); }
  }catch(e){}
})();

/* ===== 低年级文字简化：长句断短 + 去复杂修饰 ===== */
function simplify(t){
  if(!KID_MODE || !t) return t;
  try{
    // 1. 按句末标点分段
    let parts = t.split(/[。！？；]/);
    let ends = t.match(/[。！？；]/g) || [];
    let out = [];
    parts.forEach((p, pi)=>{
      if(!p.trim()) return;
      let seg = p.trim() + (ends[pi]||"");
      // 2. 长句(>22字)按逗号断成短句
      if(seg.length > 22 && seg.includes("，")){
        let sub = seg.split("，");
        let buf = "";
        sub.forEach((s, si)=>{
          if(si === sub.length-1){
            buf += s;
          } else {
            buf += s + "，";
          }
          // 满18字或最后一个分句时输出
          if(buf.length >= 18 || si === sub.length-1){
            out.push(buf.trim());
            buf = "";
          }
        });
        if(buf.trim()) out.push(buf.trim());
      } else {
        out.push(seg);
      }
    });
    return out.join(" ");
  }catch(e){ return t; }
}

/* ================= 三状态系统（决策改变资源） ================= */
let ST = null;   // {mission, supply, gain}
let ST_CFG = null; // {mission:{ico,nm}, supply:{ico,nm}, gain:{ico,nm}}
function applyState(delta){
  if(!ST || !ST_CFG) return;
  Object.keys(delta).forEach(k=>{
    if(ST[k]!==undefined){
      ST[k] = Math.max(0, Math.min(100, ST[k] + (delta[k]||0)));
    }
  });
  renderStates();
}
function renderStates(){
  if(!ST || !ST_CFG) return;
  const bar = document.getElementById("statesBar");
  if(!bar) return;
  const order = ["mission","supply","gain"];
  bar.innerHTML = order.map(k=>{
    const c = ST_CFG[k];
    const v = ST[k];
    const pct = Math.max(4, Math.min(100, v));
    const warn = v<=25 ? " st-low" : "";
    return `<div class="st-item${warn}"><span class="st-ico">${c.ico}</span><span class="st-nm">${c.nm}</span><div class="st-track"><div class="st-fill" style="width:${pct}%"></div></div><span class="st-val">${v}</span></div>`;
  }).join("");
}

          const pct = Math.max(4, Math.min(100, v));
          const warn = v<=25 ? " st-low" : "";
          html += `<div class="st-item${warn}"><span class="st-ico">${c.ico}</span><span class="st-nm">${c.nm}</span><div class="st-track"><div class="st-fill" style="width:${pct}%"></div></div><span class="st-val">${v}</span></div>`;
        }
      });
      html += `</div>`;
    }
    
  html += `<div class="narrator"><div class="avatar">${activeN.scene||"📜"}</div><div class="bubble"><span class="who">${activeN.who||"📜 说书人"}</span>${simplify(activeN.narrator)}</div></div>`;
  if(activeN.illus && activeN.illus.timing === "before"){
    html += `<div class="illus-box"><div class="illus-title">${activeN.illus.title||"示意图"}</div><div class="illus-svg">${activeN.illus.svg}</div>${activeN.illus.caption?`<div class="illus-cap">${activeN.illus.caption}</div>`:""}</div>`;
  }
  if(activeN.interlude){
    html += `<div class="interlude-banner">🎬 ${activeN.interlude}</div>`;
  }
  if(activeN.map){
    html += `<div class="mapbox"><div class="m-title">${activeN.map.title}</div><div class="maprow">`;
    activeN.map.stops.forEach((s,idx)=>{
      html += `<div class="mstop ${s.cls||""}"><span class="pin">${s.ico}</span><span class="nm">${s.nm}</span><span class="note">${s.note||""}</span></div>`;
      if(idx < activeN.map.stops.length-1) html += `<div class="mpath ${idx>=activeN.map.highlight?"off":""}"></div>`;
    });
    html += `</div></div>`;
  }
  /* ===== 知识应用（实操）===== */
  if(activeN.apply){
    const ap = activeN.apply;
    if(ap.type==="sort"){
      html += `<div class="apply-box" data-type="sort" data-next="${ap.next}" data-item="${ap.item||""}" data-give="${ap.give||""}">
        <div class="ap-title">🎯 ${ap.title||"动手做一做"}</div>
        <div class="ap-ask">${ap.ask||""}</div>
        <div class="ap-sort">${ap.items.map((t,i)=>`<button class="ap-chip" data-idx="${i}" data-ok="${ap.order.indexOf(i)}">${t}</button>`).join("")}</div>
        <div class="ap-feedback"></div>
        <button class="next-btn ap-go" style="display:none;">继续 ▶</button>
      </div>`;
    } else if(ap.type==="pick"){
      html += `<div class="apply-box" data-type="pick" data-next="${ap.next}" data-item="${ap.item||""}" data-give="${ap.give||""}" data-need="${ap.need||1}">
        <div class="ap-title">🎯 ${ap.title||"动手做一做"}</div>
        <div class="ap-ask">${ap.ask||""}</div>
        <div class="ap-pick">${ap.options.map((o,i)=>`<button class="ap-chip ap-pick-btn" data-idx="${i}" data-correct="${o.correct?1:0}">${o.text}</button>`).join("")}</div>
        <div class="ap-feedback"></div>
        <button class="next-btn ap-go" style="display:none;">继续 ▶</button>
      </div>`;
    } else if(ap.type==="pair"){
      html += `<div class="apply-box" data-type="pair" data-next="${ap.next}" data-item="${ap.item||""}" data-give="${ap.give||""}">
        <div class="ap-title">🎯 ${ap.title||"动手做一做"}</div>
        <div class="ap-ask">${ap.ask||""}</div>
        <div class="ap-pair">
          <div class="ap-left">${ap.left.map((t,i)=>`<button class="ap-chip ap-L" data-i="${i}">${t}</button>`).join("")}</div>
          <div class="ap-right">${ap.right.map((t,i)=>`<button class="ap-chip ap-R" data-i="${i}" data-match="${ap.mapping.indexOf(i)}">${t}</button>`).join("")}</div>
        </div>
        <div class="ap-feedback"></div>
        <button class="next-btn ap-go" style="display:none;">继续 ▶</button>
      </div>`;
    } else if(ap.type==="slider"){
      // 滑块：把值调到目标范围（如李冰分水比例）+ 结果预览
      const showTpl = ap.show ? `
        <div class="ap-slider-show">
          <div class="ap-show-stage" id="apShowStage">${ap.show.default||""}</div>
          <div class="ap-show-label" id="apShowLabel">${ap.show.labelDefault||""}</div>
        </div>` : "";
      html += `<div class="apply-box" data-type="slider" data-next="${ap.next}" data-item="${ap.item||""}" data-give="${ap.give||""}" data-min="${ap.min||0}" data-max="${ap.max||100}" data-ok="${ap.ok||0}" data-tol="${ap.tol||15}" data-show="${encodeURIComponent(JSON.stringify(ap.show||{}))}">
        <div class="ap-title">🎯 ${ap.title||"动手调一调"}</div>
        <div class="ap-ask">${ap.ask||""}</div>
        <div class="ap-slider">
          <div class="ap-slider-labels">${ap.labels?`<span>${ap.labels[0]}</span><span>${ap.labels[1]}</span>`:""}</div>
          <input type="range" class="ap-range" min="${ap.min||0}" max="${ap.max||100}" value="${Math.floor((ap.min||0+(ap.max||100))/2)}">
          <div class="ap-slider-val" id="apSliderVal"></div>
        </div>
        ${showTpl}
        <div class="ap-feedback"></div>
        <button class="next-btn ap-go" style="display:none;">继续 ▶</button>
      </div>`;
    }
  }
  html += `<div class="choices" id="choices"></div>`;
  stage.innerHTML = html;

  const cbox = $("choices");
  /* 高级选项优先（玩过前置故事 + quiz 答对才出现） */
  const baseChoices = activeN.choices || [];
  // 前置检测：节点 prereq 或 extract.prereq
  const preKey = activeN.prereq || (activeN.extract && activeN.extract.prereq) || "";
  let hasPreDone = false;
  if(preKey){
    try{
      const done = JSON.parse(localStorage.getItem("shiguang_story_progress") || "{}");
      hasPreDone = done[preKey] && done[preKey].done;
    }catch(e){}
  }
  const advChoices = (hasPreDone && activeN.prereqChoices) ? activeN.prereqChoices : [];
  const quizEl = stage.querySelector(".extract-quiz");
  const hasQuiz = !!quizEl;

  // 无 quiz：直接渲染全部选项；有 quiz：先只渲染基础选项，答对后追加高级选项
  const renderChoices = (withAdv)=>{
    cbox.innerHTML = "";
    const list = withAdv ? [...advChoices, ...baseChoices] : baseChoices;
    list.forEach((c)=>{
      const btn = document.createElement("button");
      btn.className = "choice" + (c.adv ? " adv" : "");
      btn.innerHTML = `<span class="c-ico">${c.ico}</span><span>${c.text}</span>`;
      btn.addEventListener("click", ()=>choose(activeN, c, btn));
      cbox.appendChild(btn);
    });
  };
  renderChoices(!hasQuiz);

  // quiz 交互：答对解锁高级选项，答错复习
  if(quizEl && hasQuiz){
    const quizData = JSON.parse(decodeURIComponent(quizEl.dataset.quiz || "{}"));
    const opts = quizEl.querySelectorAll(".quiz-opt");
    const fb = quizEl.querySelector(".quiz-fb");
    let answered = false;
    opts.forEach((btn, idx)=>{
      btn.addEventListener("click", ()=>{
        if(answered) return;
        answered = true;
        const opt = quizData.options[idx];
        if(opt.correct){
          btn.classList.add("quiz-right");
          opts.forEach(x=>x.disabled = true);
          if(fb) fb.innerHTML = `<div class="quiz-good">${quizData.pass_text||"🎉 答对了！"}</div>`;
          sfx.good();
          // 解锁高级选项
          renderChoices(true);
        } else {
          btn.classList.add("quiz-wrong");
          if(fb) fb.innerHTML = `<div class="quiz-bad">${opt.why||quizData.fail_text||"再想想"}</div>`;
          sfx.bad();
          // 允许重试（答错不锁死）：清除其他选项的错误标记，保留当前提示
          answered = false;
          opts.forEach(x=>{ x.disabled = false; if(x!==btn) x.classList.remove("quiz-wrong"); });
        }
      });
    });
  }
  initApply();
}

function choose(n, c, btn){
  sfx.move();
  document.querySelectorAll(".choice").forEach(b=>b.classList.add("disabled"));
  if(c.good===false){ btn.classList.add("wrong"); }
  else { btn.classList.add("correct"); }
  /* ===== 三状态变化 ===== */
  if(c.st) applyState(c.st);
  if(c.item && !owned.has(c.item)){
    owned.add(c.item);
    updateBag();
    sfx.star();
  }
  if(c.kTitle){
    const fb = document.createElement("div");
    fb.className = "feedback knowledge" + (c.good===false?" bad":"");
    fb.innerHTML = `<h4>${c.good===false?"🧠 线索":"✨ 你获得了知识"}</h4><div class="k-title">${c.kTitle}</div><div>${c.kBody}</div>`;
    stage.appendChild(fb);
  }
  /* ===== 选择后显示示意图（默认时机：答后揭晓）===== */
  if(n.illus && n.illus.timing !== "before"){
    const ib = document.createElement("div");
    ib.className = "illus-box reveal";
    ib.innerHTML = `<div class="illus-title">${n.illus.title||"示意图"}</div><div class="illus-svg">${n.illus.svg}</div>${n.illus.caption?`<div class="illus-cap">${n.illus.caption}</div>`:""}`;
    stage.appendChild(ib);
  }
  if(c.good===false) wrongPicks++;

  const nb = document.createElement("button");
  nb.className = "next-btn";
  nb.textContent = (c.next==="end") ? "查看我的曲本 📜" : "继续 ▶";
  nb.addEventListener("click", ()=>{
    sfx.move();
    if(c.next==="end"){ renderEnd(); }
    else { renderNode(STORY.findIndex(x=>x.id===c.next)); }
  });
  stage.appendChild(nb);
}

/* ================= 知识应用（实操） ================= */
function initApply(){
  const box = document.querySelector(".apply-box");
  if(!box) return;
  const type = box.dataset.type;
  const fb = box.querySelector(".ap-feedback");
  const go = box.querySelector(".ap-go");
  const done = ()=>{
    const item = box.dataset.item;
    const give = box.dataset.give;
    if(item && !owned.has(item)){ owned.add(item); updateBag(); sfx.star(); }
    if(give){ fb.innerHTML = `<div class="ap-good">✅ ${give}</div>`; }
    else { fb.innerHTML = `<div class="ap-good">✅ 答对了！</div>`; }
    sfx.good();
    go.style.display = "block";
    box.querySelectorAll(".ap-chip").forEach(b=>b.disabled=true);
  };
  const wrong = (msg)=>{
    fb.innerHTML = `<div class="ap-bad">😅 ${msg||"再想想~"}</div>`;
    sfx.bad();
    wrongPicks++;
  };
  go.addEventListener("click", ()=>{
    sfx.move();
    renderNode(STORY.findIndex(x=>x.id===box.dataset.next));
  });

  if(type==="sort"){
    const chips = [...box.querySelectorAll(".ap-chip")];
    // 点击按正确顺序收集，点错重来
    let expect = 0;
    chips.forEach(ch=>{
      ch.addEventListener("click", ()=>{
        const okIdx = Number(ch.dataset.ok);
        if(okIdx === expect){
          ch.classList.add("ap-done");
          ch.disabled = true;
          expect++;
          sfx.move();
          if(expect === chips.length) done();
        } else {
          wrong("顺序不对，再看看哪个先发生？");
          expect = 0;
          chips.forEach(c=>{ c.classList.remove("ap-done"); c.disabled = false; });
        }
      });
    });
  }
  if(type==="pick"){
    const need = Number(box.dataset.need || 1);
    let picked = 0;
    box.querySelectorAll(".ap-pick-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(btn.dataset.correct === "1"){
          if(!btn.classList.contains("ap-done")){
            btn.classList.add("ap-done"); picked++; sfx.move();
          }
          if(picked >= need) done();
        }
        else { wrong("不对哦，再想想哪个才是对的？"); }
      });
    });
  }
  if(type==="pair"){
    let sel = null;
    box.querySelectorAll(".ap-L").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        sel = btn; btn.classList.add("ap-sel");
        box.querySelectorAll(".ap-L").forEach(b=>{ if(b!==btn) b.classList.remove("ap-sel"); });
      });
    });
    box.querySelectorAll(".ap-R").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(!sel){ wrong("先点左边一个！"); return; }
        if(btn.dataset.match === sel.dataset.i){
          sel.classList.add("ap-done"); btn.classList.add("ap-done");
          sel.classList.remove("ap-sel"); sel = null;
          sfx.move();
          const allL = box.querySelectorAll(".ap-L");
          const allDone = [...allL].every(b=>b.classList.contains("ap-done"));
          if(allDone) done();
        } else {
          wrong("配错啦，再想想谁和谁是一对？");
          sel.classList.remove("ap-sel"); sel = null;
        }
      });
    });
  }
  if(type==="slider"){
    const range = box.querySelector(".ap-range");
    const valEl = box.querySelector(".ap-slider-val");
    const okVal = Number(box.dataset.ok);
    const tol = Number(box.dataset.tol);
    const min = Number(box.dataset.min), max = Number(box.dataset.max);
    // 结果预览（ap.show 配置：三档状态）
    let showCfg = null;
    try{ showCfg = JSON.parse(decodeURIComponent(box.dataset.show||"{}")); }catch(e){}
    const stageEl = box.querySelector(".ap-show-stage");
    const labelEl = box.querySelector(".ap-show-label");
    function updateShow(v){
      if(!stageEl || !showCfg) return;
      const zones = showCfg.zones || [];
      let hit = zones.find(z => v >= z.min && v <= z.max);
      if(!hit) hit = zones[zones.length-1];
      stageEl.innerHTML = hit.emoji || "";
      stageEl.className = "ap-show-stage " + (hit.cls||"");
      if(labelEl) labelEl.textContent = hit.label || "";
    }
    const upd = ()=>{
      const v = Number(range.value);
      valEl.textContent = v;
      updateShow(v);
    };
    if(valEl){ valEl.textContent = range.value; }
    range.addEventListener("input", upd);
    // 初始化预览（用默认值）
    const initV = Number(range.value);
    updateShow(initV);
    // 确认按钮
    const confirmBtn = document.createElement("button");
    confirmBtn.className = "next-btn ap-confirm";
    confirmBtn.textContent = "✅ 我调好了";
    confirmBtn.style.margin = "10px auto 0";
    box.appendChild(confirmBtn);
    confirmBtn.addEventListener("click", ()=>{
      const v = Number(range.value);
      if(Math.abs(v - okVal) <= tol){
        done();
        range.disabled = true; confirmBtn.disabled = true;
      } else {
        wrong(v < okVal ? "还差一点！再往大调一点~" : "过头啦！再往小调一点~");
      }
    });
  }
}

function celebrate(){

      p.style.setProperty("--by",(Math.sin(ang)*dist).toFixed(0)+"px");
      p.style.background=colors[i%colors.length];
      p.style.left="50%"; p.style.top="50%";
      p.style.animationDelay=(Math.random()*.25).toFixed(2)+"s";

function toggleVoice(){
  const statusEl = document.getElementById("vStatus");
  const transEl = document.getElementById("vTranscript");
  const audioEl = document.getElementById("vAudio");
  const btn = document.getElementById("vRec");
  if(_sr && _sr.state !== "inactive"){ try{_sr.stop();}catch(e){} return; }
  if(_mediaRec && _mediaRec.state === "recording"){ try{_mediaRec.stop();}catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR && navigator.onLine){
    try{
      const rec = new SR(); rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false;
      rec.onresult = (e)=>{ let t=""; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; SV.voiceText=t; transEl.style.display="block"; transEl.textContent="你说："+t; };
      rec.onerror = ()=>{ startFallbackRecord(statusEl,transEl,audioEl,btn); };
      rec.onend = ()=>{ _sr=null; btn.textContent="🎤 开始讲"; if(SV.voiceRecorded||SV.voiceText){ finishVoice(statusEl,transEl); } };
      _sr = rec; rec.start(); btn.textContent="⏹ 停止"; statusEl.textContent="🎤 正在聆听，讲完点停止…";
      return;
    }catch(e){ startFallbackRecord(statusEl,transEl,audioEl,btn); return; }
  }
  startFallbackRecord(statusEl,transEl,audioEl,btn);
}
function startFallbackRecord(statusEl,transEl,audioEl,btn){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ statusEl.textContent="⚠️ 这个浏览器不支持录音，你可以直接讲给爸妈听～"; return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _mediaRec = new MediaRecorder(stream); _recChunks=[];
    _mediaRec.ondataavailable = e=>_recChunks.push(e.data);
    _mediaRec.onstop = ()=>{ const blob=new Blob(_recChunks); audioEl.src=URL.createObjectURL(blob); audioEl.style.display="block"; SV.voiceRecorded=true; btn.textContent="🎤 开始讲"; finishVoice(statusEl,transEl); stream.getTracks().forEach(t=>t.stop()); };
    _mediaRec.start(); btn.textContent="⏹ 停止"; statusEl.textContent="🔴 录音中…讲完点停止";
  }).catch(()=>{ statusEl.textContent="⚠️ 没拿到麦克风权限，你可以直接讲给爸妈听～"; });
}
function finishVoice(statusEl,transEl){

    try{
      const fb = JSON.parse(localStorage.getItem("shiguang_feedback")||"{}");
      const prog = JSON.parse(localStorage.getItem("shiguang_story_progress")||"{}");
      const data = {app:"shiguang", exported_at:new Date().toISOString(), feedback:fb, progress:prog};
      const txt = JSON.stringify(data,null,2);
      /* 通道1：复制文本（手机最可靠） */
      let copied = false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(()=>{copied=true;}).catch(()=>{});
          copied = true;
        } else if(document.execCommand){
          const ta = document.createElement("textarea");
          ta.value = txt; ta.style.position="fixed"; ta.style.left="-9999px";
          document.body.appendChild(ta); ta.focus(); ta.select();
          copied = document.execCommand("copy"); ta.remove();
        }
      }catch(e){}
      /* 通道2：下载文件（桌面最可靠） */
      try{
        const blob = new Blob([txt],{type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "shiguang_feedback_" + new Date().toISOString().slice(0,10) + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      }catch(e){}
      alert(copied ? "📤 反馈已导出并复制！去微信粘贴发给老师/家长就行～" : "📤 反馈已导出！文件已开始下载，发给老师/家长就行～");
    }catch(e){ alert("😅 导出失败："+e.message); }
  });
  try{
    const b = JSON.parse(localStorage.getItem("shiguang_badges")||"{}");
    if(b.share_master){ const eb=document.getElementById("fbBadge"); if(eb) eb.innerHTML='<div class="sv-badge-show">🏅 你已是「分享小达人」</div>'; }
  }catch(e){}
}

/* ================= 启动 ================= */
initStates();
updateBag();
if(!showCover()){ showContext(()=>renderNode(0)); }
else{ setTimeout(()=>showContext(()=>renderNode(0)), 600); }

</script>
</body>
</html>
